[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdf-parse", "node-forge"]

# Redireciona todas as rotas de backend (/api/*) para a Netlify Function (mTLS SEFAZ, Validação A1, CNPJ, PDF)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Redirecionamento SPA para o React Router / Vite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
